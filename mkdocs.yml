site_name: Unity / VRChat Workflow Wiki
site_url: https://github.com/MonadoArt/vrchat-avatar-wiki-guide

theme:
  name: material
  palette:
    scheme: slate          # dark mode by default
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Setup:
    - SDK & Project Setup: setup/sdk.md
    - Unity Settings: setup/unity-settings.md
  - Avatars:
    - Import & Rigging: avatars/rigging.md
    - Blendshapes & Visemes: avatars/blendshapes.md
    - Finger Tracking: avatars/finger-tracking.md
  - Upload:
    - Build & Publish: upload/build-publish.md
    - Common Errors: upload/errors.md